<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#09090a" />
<title>Squid Dare · control room</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Black+Han+Sans&family=Inter:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
  :root { --pink: #ed1b76; --pink-d: #9e0f4d; --teal: #037a76; --teal-d: #024f4c; --green: #2fd18a; --ink: #09090a; --card: #121214; --line: rgba(255,255,255,.08); --dim: rgba(255,255,255,.5); --ko: 'Black Han Sans', sans-serif; --num: 'Bebas Neue', sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: #fff; font-family: Inter, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; gap: 14px; padding: max(14px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom)); user-select: none;
    background: radial-gradient(120% 50% at 50% -10%, rgba(237,27,118,.22), transparent 60%), var(--ink); }

  /* the guards' masks: ○ △ □ */
  header { display: flex; align-items: center; justify-content: space-between; }
  .mark { display: flex; align-items: center; gap: 10px; }
  .shapes { display: flex; gap: 5px; }
  .shapes svg { width: 18px; height: 18px; stroke: var(--pink); stroke-width: 9; fill: none; }
  .title { line-height: 1; }
  .title b { display: block; font: 400 24px/1 var(--num); letter-spacing: .06em; }
  .title small { display: block; margin-top: 2px; font: 400 11px/1 var(--ko); color: var(--dim); letter-spacing: .12em; }
  .conn { display: flex; align-items: center; gap: 7px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); font: 400 13px/1 var(--num); letter-spacing: .12em; color: var(--dim); }
  .conn::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #c33; box-shadow: 0 0 8px #c33; }
  .conn.on { color: #fff; }
  .conn.on::before { background: var(--green); box-shadow: 0 0 8px var(--green); animation: blink 2s infinite; }
  @keyframes blink { 50% { opacity: .35; } }

  /* the card: what's happening, who's up */
  .card { position: relative; overflow: hidden; border-radius: 18px; background: var(--card); border: 1px solid var(--line); padding: 16px 16px 14px; }
  .card::before { content: ''; position: absolute; inset: 0 0 auto; height: 3px; background: var(--pink); }
  .phase { display: flex; align-items: baseline; gap: 10px; }
  .phase .ko { font: 400 22px/1 var(--ko); }
  .phase .en { font: 400 15px/1 var(--num); letter-spacing: .16em; color: var(--dim); }
  .who { display: flex; align-items: center; gap: 14px; margin-top: 14px; padding: 12px; border-radius: 12px; background: linear-gradient(160deg, var(--teal), var(--teal-d)); }
  .patch { min-width: 86px; padding: 6px 10px 2px; border-radius: 4px; background: #f4f1ea; color: #111; text-align: center; font: 400 44px/1 var(--num); letter-spacing: .04em; box-shadow: inset 0 0 0 2px rgba(0,0,0,.08), 0 2px 0 rgba(0,0,0,.25); }
  .who .lbl { font: 400 12px/1 var(--num); letter-spacing: .18em; color: rgba(255,255,255,.7); }
  .who .name { margin-top: 4px; font-weight: 800; font-size: 20px; line-height: 1.15; }
  .q { margin-top: 14px; font-weight: 700; font-size: 17px; line-height: 1.35; }
  .a { margin-top: 10px; padding: 10px 12px; border-radius: 10px; border: 1px dashed rgba(47,209,138,.5); color: var(--green); font-weight: 800; font-size: 16px; }
  .a::before { content: '정답 · ANSWER'; display: block; margin-bottom: 4px; font: 400 11px/1 var(--num); letter-spacing: .18em; color: var(--dim); }
  .count { display: flex; align-items: baseline; gap: 8px; margin-top: 14px; }
  .count b { font: 400 30px/1 var(--num); color: var(--pink); letter-spacing: .04em; }
  .count span { font: 400 14px/1 var(--num); letter-spacing: .16em; color: var(--dim); }

  /* the buttons: Korean command, English under it */
  .pad { flex: 1; display: grid; gap: 12px; align-content: end; }
  .pad.two { grid-template-columns: 1fr 1fr; }
  button { position: relative; overflow: hidden; border: 0; border-radius: 20px; min-height: 104px; padding: 14px; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; transition: transform .08s, filter .08s; }
  button:active { transform: scale(.96); filter: brightness(1.25); }
  button .ko { font: 400 30px/1 var(--ko); }
  button .en { font: 400 15px/1 var(--num); letter-spacing: .2em; opacity: .75; }
  button svg { width: 34px; height: 34px; }
  .spin, .fail, .stop { background: linear-gradient(170deg, var(--pink), var(--pink-d)); box-shadow: 0 10px 30px rgba(237,27,118,.35); }
  .pass, .play, .next { background: linear-gradient(170deg, var(--teal), var(--teal-d)); box-shadow: 0 10px 30px rgba(3,122,118,.35); }
  .spin, .stop { min-height: 170px; }
  .spin .ko, .stop .ko { font-size: 44px; }
  .stop { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 10px 50px rgba(237,27,118,.75); } }
  .dalgona { background: linear-gradient(170deg, #d99a3e, #8a5518); box-shadow: 0 10px 30px rgba(217,154,62,.3); }
  .pad.two .absent, .pad.two .music { grid-column: span 2; }
  .absent, .music { min-height: 70px; flex-direction: row; gap: 12px; background: #1c1c20; border: 1px solid var(--line); }
  .absent .ko, .music .ko { font-size: 20px; }
  .absent .en, .music .en { font-size: 13px; }
  /* the guards' shapes sliding by behind the draw's buttons */
  .trail { position: absolute; inset: auto 0 10px; display: flex; gap: 22px; opacity: .18; white-space: nowrap; animation: run 6s linear infinite; }
  .trail svg { width: 18px; height: 18px; flex: none; stroke: #fff; stroke-width: 9; fill: none; }
  @keyframes run { to { transform: translateX(-50%); } }

  .wait { text-align: center; padding: 34px 0; }
  .wait .ko { font: 400 22px/1.2 var(--ko); }
  .wait .en { margin-top: 8px; font-size: 14px; color: var(--dim); line-height: 1.4; }
  .sent { position: fixed; left: 50%; top: max(64px, calc(env(safe-area-inset-top) + 48px)); transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; background: #fff; color: var(--ink); font: 400 15px/1 var(--num); letter-spacing: .14em; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .sent.show { opacity: 1; }
</style>
<!-- where the relay is (the AWS WebSocket); a ?w= link overrides it -->
<script src="/backend.js"></script>
</head>
<body>
  <header>
    <div class="mark">
      <div class="shapes" id="shapes"></div>
      <div class="title"><b>SQUID DARE</b><small>관제실 · CONTROL ROOM</small></div>
    </div>
    <div class="conn" id="conn">CONNECTING</div>
  </header>
  <section class="card" id="card"></section>
  <section class="pad" id="pad"></section>
  <div class="sent" id="sent"></div>

<script>
  const key = new URLSearchParams(location.search).get('k')
  const $ = (id) => document.getElementById(id)
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
  const SHAPE = {
    o: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40"/></svg>',
    t: '<svg viewBox="0 0 100 100"><path d="M50 10L92 88H8Z"/></svg>',
    s: '<svg viewBox="0 0 100 100"><rect x="10" y="10" width="80" height="80"/></svg>',
  }
  $('shapes').innerHTML = SHAPE.o + SHAPE.t + SHAPE.s
  const O = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="34" fill="none" stroke="currentColor" stroke-width="12"/></svg>'
  const X = '<svg viewBox="0 0 100 100"><path d="M22 22L78 78M78 22L22 78" stroke="currentColor" stroke-width="13" stroke-linecap="round"/></svg>'
  const PLAY = '<svg viewBox="0 0 100 100"><path d="M32 20L80 50L32 80Z" fill="currentColor"/></svg>'
  const DALGONA = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#d99a3e"/><path d="M50 30L54.7 43.5H69L57.6 52L61.8 65.5L50 57.3L38.2 65.5L42.4 52L31 43.5H45.3Z" fill="none" stroke="#5a300c" stroke-width="3.5" stroke-linejoin="round"/></svg>'
  const STOP = '<svg viewBox="0 0 100 100"><rect x="24" y="24" width="52" height="52" rx="4" fill="currentColor"/></svg>'
  const trail = `<span class="trail">${[...Array(16)].map((_, i) => SHAPE['ots'[i % 3]]).join('')}</span>`

  // which buttons each moment of the game gets: [command, icon, Korean, English]
  const PADS = {
    pick: [['spin', PLAY + trail, '음악 시작', 'Start the music']],
    // the draw is on: it rides the song until the music stops
    stop: [['stop', STOP + trail, '음악 정지', 'Stop the music']],
    // their turn: the host chooses a question or a dalgona
    picked: [['play', PLAY, '문제', 'Question'], ['dalgona', DALGONA, '달고나', 'Dalgona'], ['absent', '', '불참', 'Not here today'], ['music', '', '음악 정지', 'Stop music']],
    question: [['pass', O, '통과', 'Pass'], ['fail', X, '탈락', 'Eliminate']],
    redlight: [['pass', O, '통과', 'Spare'], ['fail', X, '탈락', 'Eliminate']],
    dalgona: [['pass', O, '통과', 'Pass'], ['fail', X, '탈락', 'Eliminate']],
    survived: [['next', PLAY, '다음 참가자', 'Next player'], ['music', '', '음악 정지', 'Stop music']],
    dare: [['next', PLAY, '다음 참가자', 'Next player'], ['music', '', '음악 정지', 'Stop music']],
    end: [['music', '', '음악 정지', 'Stop music']],
  }
  const LABEL = {
    lobby: ['대기실', 'Waiting room'], pick: ['어울림 게임', 'The draw'], picked: ['호명', 'Player called'],
    question: ['문제', 'Question'], dalgona: ['달고나', 'Dalgona'], redlight: ['무궁화 꽃이 피었습니다', 'Red light'],
    survived: ['생존', 'Survived'], eliminated: ['탈락', 'Eliminated'], dare: ['벌칙', 'Penalty'], end: ['게임 종료', 'Game over'],
  }

  let game = true // false once the game's tab has closed: the session is over
  let last = null
  function render(s) {
    last = s
    const phase = s?.phase ?? 'lobby'
    const [ko, en] = LABEL[phase] ?? [phase, '']
    let card = `<div class="phase"><span class="ko">${ko}</span><span class="en">${en}</span></div>`
    if (s?.no) card += `<div class="who"><span class="patch">${esc(s.no)}</span><div><div class="lbl">PLAYER · 참가자</div><div class="name">${esc(s.name)}</div></div></div>`
    if (s?.question && (phase === 'question' || phase === 'redlight' || phase === 'dalgona')) {
      card += `<div class="q">${esc(s.question)}</div>`
      if (s.answer) card += `<div class="a">${esc(s.answer)}</div>`
    }
    if (s?.dare && (phase === 'eliminated' || phase === 'dare')) card += `<div class="q">${esc(s.dare)}</div>`
    if (s?.total) card += `<div class="count"><b>${String(s.remaining).padStart(3, '0')}</b><span>of ${s.total} players remain</span></div>`
    $('card').innerHTML = card

    const pad = game ? (phase === 'pick' && s?.spinning ? PADS.stop : PADS[phase]) : null
    $('pad').className = 'pad' + (['question', 'redlight', 'dalgona', 'picked'].includes(phase) && game ? ' two' : '')
    $('pad').innerHTML = pad
      ? pad.map(([cmd, icon, ko, en]) => `<button class="${cmd}" data-cmd="${cmd === 'stop' ? 'music' : cmd}">${icon}<span class="ko">${ko}</span><span class="en">${en}</span></button>`).join('')
      : !game
        ? '<div class="wait"><div class="ko">연결 종료</div><div class="en">The game was closed. Scan the new code on the laptop to take control again.</div></div>'
        : phase === 'lobby'
          ? '<div class="wait"><div class="ko">대기 중</div><div class="en">Start the game on the laptop.</div></div>'
          : '<div class="wait"><div class="ko">잠시만요</div><div class="en">Hold on…</div></div>'
  }

  let toast
  const flash = (text) => {
    $('sent').textContent = text
    $('sent').classList.add('show')
    clearTimeout(toast)
    toast = setTimeout(() => $('sent').classList.remove('show'), 1200)
  }
  $('pad').addEventListener('click', (e) => {
    const b = e.target.closest('button')
    if (!b) return
    navigator.vibrate?.(30)
    if (ws?.readyState !== 1) return flash('연결 끊김 · OFFLINE')
    ws.send(JSON.stringify({ action: 'cmd', key, cmd: b.dataset.cmd, id: String(Date.now()) }))
  })

  render(null)
  const status = (text, on) => { $('conn').textContent = text; $('conn').classList.toggle('on', on) }
  // the line to the game, through the relay: a WebSocket that comes back by
  // itself if the phone sleeps or the Wi-Fi drops
  const W = new URLSearchParams(location.search).get('w') || window.SQUID_WS
  let ws = null
  // the game's tab closed (or this is an old link): the session is over, for good
  const ended = () => { game = false; ws?.close(); status('OFFLINE', false); render(last) }
  function connect() {
    ws = new WebSocket(W)
    ws.onopen = () => { status('LIVE', true); ws.send(JSON.stringify({ action: 'phone', key })) }
    ws.onclose = () => { if (!game) return; status('RECONNECTING', false); setTimeout(connect, 1500) }
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data)
      if (m.type === 'state') render(m.state)
      if (m.type === 'sent') flash('전송 · SENT')
      if (m.type === 'ended') ended()
    }
  }
  setInterval(() => { if (ws?.readyState === 1) ws.send(JSON.stringify({ action: 'ping' })) }, 4 * 60 * 1000)
  if (key && W) connect(); else ended()
</script>
</body>
</html>
